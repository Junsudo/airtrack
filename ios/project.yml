name: AirTrack
options:
  bundleIdPrefix: com.junsu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 46X57DX48D
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # 기내 오프라인 moving map — 웹앱(docs/)을 그대로 번들하고, 위치는 native
  # CLLocationManager가 공급한다. 백그라운드에서는 native가 트랙을 버퍼링했다가
  # 복귀 시 웹으로 일괄 주입 → 화면이 꺼져 있어도 트랙이 끊기지 않는다.
  AirTrack:
    type: application
    platform: iOS
    sources:
      - path: AirTrack
        excludes:
          - "web"
      - path: AirTrack/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junsu.airtrack
        INFOPLIST_FILE: AirTrack/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
